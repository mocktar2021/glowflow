name: GlowFlow disposable extension fixture

on:
  pull_request:
    paths:
      - .github/workflows/glow56-extension-fixture.yml
      - tests/glow56-extension-fixture.sh
      - tests/glow56-inactive-cron-fixture.sh
      - tests/glow56-pgnet-acl-fixture.sh
      - tests/glow56-real-cleanup-pg17-fixture.sh
      - ops/glow56-stage-inactive-cron.psql
      - ops/glow56-unstage-inactive-cron.psql
      - tests/public-booking-cleanup-cadence.test.mjs
      - tests/supabase-platform-fixture.sql
      - tests/schema-authorization.sql
      - supabase/schema.sql
      - supabase/migrations/*glow56*.sql
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension-catalog:
    name: GLOW-56 disposable PG17 extension catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Supabase PostgreSQL 17.6.1.166, pinned to the published multi-arch index.
        # This is an isolated GitHub Actions container, never the hosted GlowFlow DB.
        image: supabase/postgres@sha256:b3bfedb107413abb3b8cb0d0874b0414a1dceb3d55bc0c778de6ad22d1f7dc86
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-start-period 60s
          --health-retries 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client-16
      - name: Verify exact disposable extension availability
        env:
          PGPASSWORD: local-ci-only
        run: bash tests/glow56-extension-fixture.sh
      - name: Prove inactive pg_cron creation and collision behavior
        env:
          PGPASSWORD: local-ci-only
        run: bash tests/glow56-inactive-cron-fixture.sh
      - name: Inspect disposable pg_net and Vault ACLs
        env:
          PGPASSWORD: local-ci-only
        run: bash tests/glow56-pgnet-acl-fixture.sh
      - name: Replay real cleanup migrations and stage inactive candidates
        env:
          PGPASSWORD: local-ci-only
        run: bash tests/glow56-real-cleanup-pg17-fixture.sh

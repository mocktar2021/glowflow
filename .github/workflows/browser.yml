name: GlowFlow browser checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  booking-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: booking-browser-evidence
          path: test-results/browser
          retention-days: 7
  booking-postgis:
    name: Browser to disposable PostGIS booking
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client-16
      - run: npx playwright install --with-deps chromium
      - name: Run fictional browser to local PostGIS booking
        env:
          GLOWFLOW_RLS_ADMIN_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/postgres
        run: node tests/browser-postgis-run.mjs
      - name: Run lost-response recovery-only cutover against disposable PostGIS
        env:
          GLOWFLOW_RLS_ADMIN_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/postgres
          GLOWFLOW_BROWSER_POSTGIS_SCENARIO: recovery_only
        run: node tests/browser-postgis-run.mjs
      - name: Run non-commit recovery-only cutover against disposable PostGIS
        env:
          GLOWFLOW_RLS_ADMIN_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/postgres
          GLOWFLOW_BROWSER_POSTGIS_SCENARIO: recovery_only_noncommitted
        run: node tests/browser-postgis-run.mjs
      - name: Run non-migration recovery-only local route prototype
        env:
          GLOWFLOW_RLS_ADMIN_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/postgres
        run: node tests/recovery-only-postgis-run.mjs

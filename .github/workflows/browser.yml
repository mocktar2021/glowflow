name: GlowFlow browser checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  booking-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-browser-evidence
          path: test-results/browser
          retention-days: 7

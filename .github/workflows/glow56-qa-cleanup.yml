name: GlowFlow shared-sandbox booking cleanup (dormant)

# This fixed Supabase ref also backs glowflow.mocktar.com. The job stays
# skipped until a new, separately approved repository ACK is set. The old
# service-role-key schedule ACK cannot enable this replacement.
on:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: glowflow-qa-booking-cleanup
  cancel-in-progress: false

jobs:
  qa-cleanup:
    if: ${{ github.repository == 'mocktar2021/glowflow' && github.ref == 'refs/heads/master' && vars.GLOWFLOW_QA_CLEANUP_SCHEDULE_ACK == 'enable-glow56-qa-oidc-cleanup-20261110' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No Environment: the existing human-review gate would pause every run.
    # This replacement carries no database or Healthchecks secret in Actions.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Request short-lived GitHub identity and run bounded QA cleanup
        run: node ops/booking-v2-oidc-trigger.mjs

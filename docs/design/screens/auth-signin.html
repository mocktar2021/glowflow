<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GlowFlow, Sign in</title>
<link rel="stylesheet" href="brand.css">
<style>
  body{min-height:100vh}
  .split{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
  .left{display:flex;flex-direction:column;padding:40px 64px;background:var(--porcelain)}
  .left header{display:flex;align-items:center;justify-content:space-between}
  .left header img{height:28px}
  .lang{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);height:38px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--white)}
  .form-wrap{flex:1;display:flex;align-items:center}
  .form{width:100%;max-width:420px;margin:0 auto}
  .form .eyebrow{margin-bottom:16px}
  .form h1{margin-bottom:18px}
  .form .lead{font-size:17px;margin-bottom:36px}
  .field{margin-bottom:18px}
  .field .label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .field .label a{font-size:13px;color:var(--mulberry);font-weight:500}
  .input-icon{position:relative}
  .input-icon .icon{position:absolute;left:16px;top:14px;color:var(--muted)}
  .input-icon .input{padding-left:46px}
  .input-icon .eye{position:absolute;right:6px;top:4px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:var(--r-pill)}
  .input-icon .eye .icon{position:static}
  .input:focus,.input.is-focus{outline:none;border-color:var(--mulberry);box-shadow:0 0 0 2px rgba(122,70,89,.4)}
  .remember{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2);margin:6px 0 26px}
  .box{width:20px;height:20px;border-radius:6px;background:var(--mulberry);display:flex;align-items:center;justify-content:center}
  .box svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .btn-block{width:100%}
  .or{display:flex;align-items:center;gap:14px;margin:26px 0;font-size:13px;color:var(--muted)}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  .g{width:18px;height:18px}
  .new{margin-top:32px;text-align:center;font-size:15px;color:var(--muted)}
  .new a{color:var(--mulberry);font-weight:500;border-bottom:1px solid var(--rose);padding-bottom:1px}
  .left footer{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
  .left footer nav{display:flex;gap:20px}

  .right{background:var(--mulberry-deep);position:relative;display:flex;align-items:center;justify-content:center;padding:56px;overflow:hidden}
  .right::before{content:"";position:absolute;width:640px;height:640px;border-radius:50%;border:1px solid rgba(242,221,214,.14);right:-220px;top:-200px}
  .right::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;border:1px solid rgba(242,221,214,.10);left:-200px;top:-180px}
  .frame{position:relative;width:420px;max-width:100%;z-index:1}
  .photo{border-radius:220px 220px var(--r-xl) var(--r-xl);overflow:hidden;aspect-ratio:3/4;box-shadow:var(--shadow-lg);border:6px solid rgba(250,246,241,.08)}
  .photo img{width:100%;height:100%;object-fit:cover}
  .quote{position:absolute;left:-72px;bottom:44px;width:330px;background:var(--porcelain);border-radius:var(--r-lg);padding:22px 24px;box-shadow:var(--shadow-lg)}
  .quote p{font-family:var(--font-display);font-size:21px;line-height:1.3;color:var(--ink);font-weight:500}
  .quote .who{display:flex;align-items:center;gap:12px;margin-top:16px}
  .av{width:38px;height:38px;border-radius:50%;background:var(--blush);color:var(--mulberry-deep);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
  .who b{display:block;font-size:14px;font-weight:500;color:var(--ink)}
  .who span{font-size:13px;color:var(--muted)}
  .tag{position:absolute;right:-24px;top:64px;display:flex;align-items:center;gap:10px;background:var(--white);border-radius:var(--r-pill);padding:10px 16px 10px 10px;box-shadow:var(--shadow-md);font-size:13.5px;color:var(--ink-2)}
  .tag .dot{width:30px;height:30px;border-radius:50%;background:var(--sage-soft);color:var(--sage-deep);display:flex;align-items:center;justify-content:center}
  .tag .dot .icon{width:16px;height:16px}
  .tag b{font-weight:500;color:var(--ink)}
  .right .caption{position:absolute;left:56px;bottom:40px;color:rgba(250,246,241,.72);font-size:13px;letter-spacing:.14em;text-transform:uppercase;z-index:1}
  .right .brandmark{position:absolute;right:56px;bottom:36px;height:22px;opacity:.85;z-index:1}
</style>
</head>
<body>
<div class="split">
  <section class="left">
    <header>
      <img src="../brand/logo/glowflow-wordmark.svg" alt="GlowFlow">
      <span class="lang"><svg class="icon" style="width:16px;height:16px" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>English</span>
    </header>

    <div class="form-wrap">
      <form class="form" onsubmit="return false">
        <p class="eyebrow">Salon workspace</p>
        <h1 class="display-lg">Welcome back to your <em>salon.</em></h1>
        <p class="lead">Your calendar, clients and today's bookings are waiting.</p>

        <div class="field">
          <label class="label" for="email"><span>Email</span></label>
          <div class="input-icon">
            <svg class="icon" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
            <input id="email" class="input is-focus" type="email" value="aicha@example.invalid">
          </div>
        </div>
        <div class="field">
          <label class="label" for="pw"><span>Password</span><a href="#">Forgot password?</a></label>
          <div class="input-icon">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="pw" class="input" type="password" value="porcelain2026">
            <button class="eye" type="button" aria-label="Show password" style="background:none;border:0"><svg class="icon" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <div class="remember"><span class="box"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>Keep me signed in on this device</div>

        <button class="btn btn-primary btn-block">Sign in</button>
        <div class="or">or</div>
        <button class="btn btn-ghost btn-block" type="button">
          <svg class="g" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.6c2.1-1.9 3.3-4.8 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.8c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.9A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.1a6.6 6.6 0 0 1 0-4.2V7H2.1a11 11 0 0 0 0 10l3.7-2.9z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2.1 7l3.7 2.9C6.7 7.3 9.1 5.4 12 5.4z"/></svg>
          Continue with Google
        </button>
        <p class="new">New to GlowFlow? <a href="auth-register.html">Create your workspace</a></p>
      </form>
    </div>

    <footer>
      <span>&copy; 2026 GlowFlow</span>
      <nav><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Help centre</a></nav>
    </footer>
  </section>

  <aside class="right">
    <div class="frame">
      <div class="photo"><img src="glowflow-manicure.png" alt="A nail technician refining a client's cuticles at a marble table"></div>
      <div class="tag"><span class="dot"><svg class="icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span><span><b>14 bookings</b> today</span></div>
      <figure class="quote">
        <p>&ldquo;My Saturdays used to start with a stack of messages. Now the calendar is simply full.&rdquo;</p>
        <figcaption class="who"><span class="av">FN</span><span><b>Fatou Ndiaye</b><span>Owner, Atelier Fatou, Dakar</span></span></figcaption>
      </figure>
    </div>
    <span class="caption">Booking for independent salons</span>
    <img class="brandmark" src="../brand/logo/glowflow-mark-on-dark.svg" alt="">
  </aside>
</div>
</body>
</html>
